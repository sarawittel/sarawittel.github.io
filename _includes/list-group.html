<ul class="list-group">
  {% for item in include.items %}
    <li class="list-group-item">
      <a
        href="{{ item.url | relative_url }}"
        class="list-group-title"
      >
        {{ item.title }}
      </a>

      {% if item.meta %}
        <span class="list-group-meta">
          {{ item.meta }}
        </span>
      {% endif %}
    </li>
  {% endfor %}
</ul>
