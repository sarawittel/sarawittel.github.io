---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>

  <p class="meta">
    {{ page.date | date: "%B %d, %Y" }}
    ·
    {% assign words = content | number_of_words %}
    {% assign minutes = words | divided_by: 200 %}
    {% if minutes < 1 %}
      1 min read
    {% else %}
      {{ minutes }} min read
    {% endif %}
  </p>

  {{ content }}
</article>
