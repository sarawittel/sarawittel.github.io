---
layout: default
---

<article class="post-content">
  <h1>{{ page.title }}</h1>

  <p class="post-meta">
    {{ page.date | date: "%B %d, %Y" }}
  </p>

  {% if page.tags %}
    <p class="post-meta">
      {% for tag in page.tags %}
        <a href="{{ '/tags/#' | append: tag | relative_url }}">#{{ tag }}</a>
      {% endfor %}
    </p>
  {% endif %}

  {{ content }}
</article>
